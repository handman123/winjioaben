name: Build Windows EXE

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install psutil pyinstaller

      - name: Build EXE
        run: pyinstaller --onefile --windowed --hidden-import psutil --name GameDataKeeper main.py

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: GameDataKeeper-Windows
          path: dist/GameDataKeeper.exe

      - name: Set release type
        id: rel
        shell: bash
        run: |
          if [ "${{ github.ref_name }}" = "main" ]; then
            echo "tag=stable" >> $GITHUB_OUTPUT
            echo "name=Stable Build" >> $GITHUB_OUTPUT
            echo "prerelease=false" >> $GITHUB_OUTPUT
          else
            echo "tag=beta" >> $GITHUB_OUTPUT
            echo "name=Beta Build (${{ github.ref_name }})" >> $GITHUB_OUTPUT
            echo "prerelease=true" >> $GITHUB_OUTPUT
          fi

      - name: Publish Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.rel.outputs.tag }}
          name: ${{ steps.rel.outputs.name }}
          body: ${{ steps.rel.outputs.name }} — 自动构建。
          files: dist/GameDataKeeper.exe
          prerelease: ${{ steps.rel.outputs.prerelease }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
