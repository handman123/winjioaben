name: Build Windows EXE

on:
  push:
    branches: [main]
  workflow_dispatch:  # 允许手动触发

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install psutil pyinstaller

      - name: Build EXE
        run: pyinstaller --onefile --windowed --hidden-import psutil --name GameDataKeeper main.py

      - name: Upload EXE
        uses: actions/upload-artifact@v4
        with:
          name: GameDataKeeper-Windows
          path: dist/GameDataKeeper.exe
